name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: starter-templates-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release metadata and artwork
        run: node scripts/validate-release.cjs
      - name: Test release gates
        run: |
          node --test tests/release.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check PHP and shell syntax
        run: |
          git ls-files -z '*.php' | xargs -0 -n 1 php -l
          bash -n scripts/build-release-zip.sh release.sh
      - name: Build production UI
        run: pnpm run build
      - name: Build and validate installable ZIP
        run: bash scripts/build-release-zip.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starter-templates-package-${{ github.run_id }}
          path: dist/customify-starter-sites-*.zip
          retention-days: 3
          if-no-files-found: error
